# Composição de produção — um VPS, um docker compose.
#
# Difere do infra/docker-compose.yml (que é o de desenvolvimento) em três coisas
# que importam: nenhuma porta de banco, cache ou fila é publicada no host; todas
# as senhas vêm de .env.production; e o único processo exposto à internet é o
# Caddy, que termina o TLS.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
#
# Ver infra/README.md para o passo a passo do primeiro deploy.

name: petshop-prod

# Âncora com o que todo serviço de backend precisa. Cada um acrescenta só o que é seu.
x-backend: &backend
  image: petshop/backend:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: infra/Dockerfile
    target: backend
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    migrator: { condition: service_completed_successfully }
  environment: &backend-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/petshop?schema=public
    DATABASE_MAINTENANCE_URL: postgresql://app_maintenance:${APP_MAINTENANCE_PASSWORD}@postgres:5432/petshop?schema=public
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    RABBITMQ_URL: amqp://petshop:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ENCRYPTION_KEK: ${ENCRYPTION_KEK}
    EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER}
    INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    # O site é rota do Next: o serviço precisa alcançá-lo para invalidar a página de
    # um tenant quando o horário ou o catálogo mudam (AC-03 de MOD-SITE-11).
    FRONTEND_INTERNAL_URL: http://frontend:3002
    # As duas pontas do segredo precisam do MESMO valor — ver o serviço `frontend`.
    SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:?}
    APP_DOMAIN: ${APP_DOMAIN}
    # MOD-ADMIN: o primeiro administrador de plataforma, e só enquanto não houver nenhum.
    # Vazia é o estado normal depois do primeiro deploy.
    PLATFORM_ADMIN_BOOTSTRAP_EMAIL: ${PLATFORM_ADMIN_BOOTSTRAP_EMAIL:-}
    SUPPORT_GRANT_MAX_HOURS: ${SUPPORT_GRANT_MAX_HOURS:-72}
    # MOD-ADMIN-06 — vazia significa "os administradores de plataforma ativos".
    PLATFORM_ALERT_EMAILS: ${PLATFORM_ALERT_EMAILS:-}
    GOTENBERG_URL: http://gotenberg:3000
    # Sem elas o e-mail vira log e a mensagem consta como enviada com
    # `provider = 'log'` — ver a nota em `ports/email.ts`.
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM: ${MAIL_FROM:-}
    # MOD-AI — sem chave o agente se comporta como desligado e toda conversa vai para
    # a recepção (AC-02 de MOD-AI-07). Ver o comentário longo no compose do swarm.
    AI_PROVIDER: ${AI_PROVIDER:-anthropic}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  networks: [interna]

services:
  # ─── Dependências ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: petshop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d petshop']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]
    # Sem `ports`: o banco não tem por que ser alcançável da internet. Para abrir
    # um psql, use `docker compose exec postgres psql` ou um túnel SSH.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: petshop
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [interna]
    # Imagem sem `-management`: o painel web do RabbitMQ é uma superfície a menos
    # para expor num servidor de produção. Para depurar, troque a tag e suba o
    # painel atrás de um túnel SSH.

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [interna]

  evolution:
    # O canal WhatsApp (MOD-CRM-01). Tag fixa: uma sessão pareada é estado, e uma
    # atualização silenciosa desconectaria todos os petshops de uma vez.
    #
    # **Sem `ports` e sem rota no Caddyfile**, como o banco: ela manda mensagem pelo
    # número da empresa, e quem fala com ela é o módulo de mensagens, pela rede interna.
    # `evoapicloud`, e não `atendai`: o projeto trocou de organização no Docker Hub em
    # 2025, e o repositório antigo parou na v2.2.3 e deixou de aceitar pull anônimo —
    # um `docker pull` de lá responde "pull access denied", que parece erro de rede.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      migrator: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      # O database `evolution` é criado pelo migrator (ver infra/Dockerfile) — daí a
      # dependência dele acima, e não do postgres.
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: petshop
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      # O histórico é do produto, cifrado com a DEK do tenant. Uma segunda cópia em
      # claro aqui seria dado pessoal fora de todo o controle do MOD-CRM.
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/7
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: 'false'
      WEBHOOK_GLOBAL_ENABLED: 'false'
      DEL_INSTANCE: 'false'
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution-instances:/evolution/instances
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [interna]

  # ─── Migração ───────────────────────────────────────────────────────────────
  # Roda uma vez a cada `up`, antes de qualquer serviço. Os outros containers
  # esperam por `service_completed_successfully`: se a migração falhar, nada sobe
  # com o schema errado.
  migrator:
    image: petshop/migrator:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: migrator
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # Migrations rodam como owner: só ele cria papéis, políticas de RLS e triggers.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/petshop?schema=public
      # `directUrl` do schema.prisma. A CLI do Prisma PARSEIA o schema e aborta se a
      # variável não existir (P1012), mesmo que a URL não fosse usada — foi o que
      # derrubou o primeiro deploy real. O cliente em runtime não precisa dela, por
      # isso ela não aparece no backend: só a CLI (migrate/generate) a exige.
      # Mesmo valor da DATABASE_URL acima: migração roda como owner, e é o owner que
      # cria role, política de RLS e trigger.
      DATABASE_MIGRATION_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/petshop?schema=public
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      APP_MAINTENANCE_PASSWORD: ${APP_MAINTENANCE_PASSWORD}
      ENCRYPTION_KEK: ${ENCRYPTION_KEK}
      EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER}
    networks: [interna]

  # ─── Serviços ───────────────────────────────────────────────────────────────
  api-gateway:
    <<: *backend
    command: ['node', 'backend/app/dist/src/server.js']
    environment:
      <<: *backend-env
      GATEWAY_PORT: 3000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      # MOD-IDENT-03: assinatura do webhook de sincronização. Opcional — sem ela a rota
      # recusa tudo com 401, que é o comportamento certo de um endpoint sem segredo.
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      # Origens exatas: o `@clerk/backend` compara com `includes(azp)`, sem curinga.
      # Ver o comentário longo em `docker-compose.swarm.yml`.
      CLERK_AUTHORIZED_PARTIES: https://app.${APP_DOMAIN},https://${APP_DOMAIN}
      # MOD-SITE: a galeria do site do estabelecimento, no mesmo bucket do álbum do
      # pet, em prefixo próprio. Vieram com o módulo na consolidação.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-petshop-media}
      R2_REGION: ${R2_REGION:-auto}
      # O canal WhatsApp (MOD-CRM-01) e o retorno do Resend (MOD-NOTIF-10), que vieram
      # com o módulo de mensagens na consolidação.
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      # Para onde a Evolution devolve o pareamento e as quedas de conexão: o próprio
      # backend, pela rede interna. Este webhook nunca passa pelo Caddy — o do Resend,
      # sim, porque quem o chama está na internet.
      EVOLUTION_WEBHOOK_URL: http://api-gateway:3000/internal/v1/whatsapp/webhook
      # Sem o segredo a rota do Resend recusa **tudo** com 401 — é deliberado: um
      # webhook aberto é uma porta para suprimir o endereço de qualquer concorrente.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # MOD-TUTOR: a consulta de CEP e a régua de inatividade, que vieram com o módulo.
      VIACEP_BASE_URL: ${VIACEP_BASE_URL:-https://viacep.com.br/ws}
      CEP_LOOKUP_TIMEOUT_MS: ${CEP_LOOKUP_TIMEOUT_MS:-3000}
      INACTIVITY_THRESHOLD_DAYS: ${INACTIVITY_THRESHOLD_DAYS:-90}
      # MOD-IDENT: o link do convite e o prazo dele, que vieram com o módulo na
      # fatia 7. `APP_URL` é a URL pública completa e **não** o `APP_DOMAIN`: o
      # convite vai num e-mail que uma pessoa clica, fora desta rede.
      # `app.` e não o ápice: com o roteamento por host (MOD-SITE-11) o Admin tem
      # endereço próprio, e `/convite` é rota de Admin. O ápice também serve o Admin
      # hoje, mas o link do convite dura dias — vale apontar para o endereço canônico.
      APP_URL: https://app.${APP_DOMAIN}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s



  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: petshop/frontend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3002
      # Nome de container, não domínio: o browser nunca fala com o gateway (o
      # cliente é `server-only`), então a chamada não precisa sair da rede interna.
      API_URL: http://api-gateway:3000
      # O domínio externo, para as telas exibirem o endereço do tenant. Em tempo de
      # execução, e não como `NEXT_PUBLIC_`: o prefixo público seria inlinado no
      # build e amarraria a imagem a uma instalação.
      APP_DOMAIN: ${APP_DOMAIN}
      # A outra ponta do segredo de revalidação. Sem ela aqui o frontend cai no padrão
      # de desenvolvimento, o backend manda o valor real, e `/api/site/revalidate`
      # responde 401 a toda invalidação — em silêncio, porque a chamada é best-effort.
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:?}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    networks: [interna]

  # ─── Borda ──────────────────────────────────────────────────────────────────
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: petshop/caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [interna]

networks:
  interna:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  evolution-instances:
  caddy-data:
  caddy-config:
