# Stack de produção para Docker Swarm (VPS única, Hostinger).
#
#   set -a; . ./.env.production; set +a
#   docker stack deploy -c infra/docker-compose.swarm.yml petshop
#
# Na prática use `bash scripts/atualizar-vps.sh <versao>`, que faz isso e mais o
# que o `stack deploy` não faz sozinho. Ver docs/deploy-swarm.md.
#
# ═══ O que muda em relação ao docker-compose.prod.yml ═════════════════════════
#
# Não é o mesmo arquivo com `deploy:` acrescentado. Quatro coisas que o compose
# resolve o Swarm simplesmente não tem, e cada uma virou uma decisão aqui:
#
# 1. `build:` é IGNORADO. As imagens vêm prontas do ghcr.io — publicadas do Mac
#    por `scripts/publicar-imagens.sh`. A VPS não compila nada.
#
# 2. `depends_on:` é IGNORADO — inteiro, sem aviso. A ordenação por
#    `service_completed_successfully` do migrator não existe aqui. Quem faz o
#    papel dela é `infra/swarm/aguardar-migracao.sh`, no `command` de cada
#    serviço de backend; leia o cabeçalho daquele arquivo, é o ponto mais fácil
#    de quebrar desta stack.
#
# 3. `env_file:` é IGNORADO. Todo valor precisa estar interpolado abaixo, e o
#    `.env.production` tem de estar EXPORTADO no shell que roda o deploy.
#
# 4. `restart: unless-stopped` é ignorado; quem manda é `deploy.restart_policy`.
#
# ═══ Nó único ════════════════════════════════════════════════════════════════
# Os volumes são `local` — vivem no disco de UM nó. As restrições
# `node.role == manager` existem para que, no dia em que um segundo nó entrar no
# swarm, o Postgres não seja reagendado para uma máquina onde o volume está
# vazio: o banco subiria limpo, sem erro nenhum, e o estrago só apareceria
# quando alguém procurasse um cadastro. Para valer de verdade em vários nós,
# banco e volumes precisam sair daqui.

x-restart: &restart
  condition: any
  delay: 10s

# `order: start-first` é o que faz o gate de migração valer a pena: o container
# antigo continua atendendo enquanto o novo espera o schema. `stop-first`, o
# padrão, derrubaria o antigo e deixaria o buraco aberto durante a espera.
x-update: &update
  order: start-first
  failure_action: rollback
  delay: 10s
  parallelism: 1

x-backend: &backend
  # ATENÇÃO ao mexer nas mensagens de erro das imagens abaixo (o texto depois do
  # `:?`): elas NÃO podem conter hífen. O interpolador do `docker stack deploy` — que
  # é outro, mais antigo que o do `docker compose` — quebra a expressão no ÚLTIMO hífen
  # dela e trata o que vem depois como valor padrão, silenciosamente. Com um exemplo
  # de nome de imagem na mensagem, ela virava `migrator:0.1.0` e o Swarm recusava a
  # tarefa com "pull access denied". Medido em 19/09/2026, ao migrar de VPS — e é por
  # isso que nenhuma delas traz exemplo de nome de imagem.
#
# E pelo mesmo motivo o comentário não escreve a sintaxe de interpolação por
# extenso: o `conferir-ambiente.sh` varre estes arquivos atrás dela e não pula
# comentário — um exemplo aqui vira uma variável inexistente cobrada lá.
  image: ${BACKEND_IMAGE:?defina BACKEND_IMAGE no .env.production (a imagem publicada do backend)}
  networks: [interna]
  # 30s: o `shutdown()` de cada serviço fecha o Fastify, os jobs em curso, o
  # canal do RabbitMQ e o Prisma. O padrão do Swarm (10s) corta um job no meio.
  stop_grace_period: 30s
  environment: &backend-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    STACK_NAME: ${STACK_NAME:-petshop}
    DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?}@postgres:5432/petshop?schema=public
    DATABASE_MAINTENANCE_URL: postgresql://app_maintenance:${APP_MAINTENANCE_PASSWORD:?}@postgres:5432/petshop?schema=public
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
    RABBITMQ_URL: amqp://petshop:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
    ENCRYPTION_KEK: ${ENCRYPTION_KEK:?}
    EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER:?}
    INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?}
    FRONTEND_INTERNAL_URL: http://frontend:3002
    # `:?` e não vazio: o par com o frontend só vale se os dois lados tiverem o MESMO
    # valor, e um segredo em branco de um lado só é justamente o caso que não falha.
    SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:?}
    APP_DOMAIN: ${APP_DOMAIN}
    # MOD-ADMIN: o primeiro administrador de plataforma, e só enquanto não houver nenhum.
    # Vazia é o estado normal depois do primeiro deploy.
    PLATFORM_ADMIN_BOOTSTRAP_EMAIL: ${PLATFORM_ADMIN_BOOTSTRAP_EMAIL:-}
    SUPPORT_GRANT_MAX_HOURS: ${SUPPORT_GRANT_MAX_HOURS:-72}
    # MOD-ADMIN-06 — para quem vai o alarme operacional. Vazia é o padrão e significa
    # "os administradores de plataforma ativos", que é a lista que anda junto com a
    # equipe sem precisar de deploy.
    PLATFORM_ALERT_EMAILS: ${PLATFORM_ALERT_EMAILS:-}
    GOTENBERG_URL: http://gotenberg:3000
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM: ${MAIL_FROM:-}
    # ─── MOD-AI: o agente de atendimento (Fase 8) ───────────────────────────────
    # A chave é opcional no schema, e a ausência é um estado legítimo: sem ela o
    # agente se comporta como desligado e toda conversa vai para a recepção (AC-02 de
    # MOD-AI-07). Esquecê-la **aqui** é que é o erro caro — a tela de configuração
    # deixa ligar o atendimento automático, o interruptor acende, e nenhuma mensagem
    # de cliente é respondida. Foi o que faltava passar até 2026-09-14.
    #
    # `gemini` existe para desenvolvimento (free tier do AI Studio); produção é
    # `anthropic`. `GEMINI_MODEL` não é interpolado de propósito: o padrão mora no
    # schema, e repeti-lo aqui criaria dois lugares para mudar o mesmo valor.
    AI_PROVIDER: ${AI_PROVIDER:-anthropic}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  deploy: &backend-deploy
    replicas: 1
    restart_policy: *restart
    update_config: *update
    placement:
      constraints: [node.role == manager]
    resources:
      limits:
        # Teto, não reserva. Cada serviço usa ~150 MB em repouso; 384 MB deixa
        # espaço para um pico de importação sem permitir que um vazamento num
        # serviço leve os outros nove junto por OOM da máquina.
        memory: 384M

services:
  # ─── Dependências ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: petshop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d petshop']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem `ports`: o banco não é alcançável de fora. Para um psql, use
    # `docker exec` no container ou um túnel SSH.
    deploy:
      replicas: 1
      restart_policy: *restart
      placement:
        constraints: [node.role == manager]
      update_config:
        # `stop-first` aqui, ao contrário dos serviços: dois Postgres com o mesmo
        # diretório de dados montado ao mesmo tempo corrompem o cluster.
        order: stop-first
      resources:
        limits: { memory: 1G }
        reservations: { memory: 256M }

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?}']
    volumes:
      - redis-data:/data
    networks: [interna]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    deploy:
      replicas: 1
      restart_policy: *restart
      placement:
        constraints: [node.role == manager]
      update_config: { order: stop-first }
      resources:
        limits: { memory: 256M }

  rabbitmq:
    # Imagem sem `-management`: o painel web é uma superfície a menos num
    # servidor público. Para depurar, troque a tag e alcance-o por túnel SSH.
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: petshop
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [interna]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      replicas: 1
      restart_policy: *restart
      placement:
        constraints: [node.role == manager]
      update_config: { order: stop-first }
      resources:
        limits: { memory: 512M }

  gotenberg:
    image: gotenberg/gotenberg:8
    networks: [interna]
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy: *restart
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 512M }

  evolution:
    # O canal WhatsApp (MOD-CRM-01). Tag fixa: uma sessão pareada é estado, e uma
    # atualização silenciosa desconectaria todos os petshops de uma vez.
    #
    # **Sem `ports` e sem rota no Caddyfile.** A Evolution manda mensagem pelo número
    # da empresa; publicá-la seria oferecer isso à internet com uma chave de API entre
    # ela e o mundo. Quem fala com ela é o módulo de mensagens, pela rede interna. Para
    # depurar, use um túnel SSH.
    # `evoapicloud`, e não `atendai`: o projeto trocou de organização no Docker Hub em
    # 2025, e o repositório antigo parou na v2.2.3 e deixou de aceitar pull anônimo —
    # um `docker pull` de lá responde "pull access denied", que parece erro de rede.
    image: evoapicloud/evolution-api:v2.3.7
    networks: [interna]
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      # O database `evolution` é criado pelo migrator (ver infra/Dockerfile): aqui não
      # há `docker-entrypoint-initdb.d` montado.
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: petshop
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      # O histórico é do produto, cifrado com a DEK do tenant. Uma segunda cópia em
      # claro aqui seria um depósito de dado pessoal fora de todo o controle do MOD-CRM.
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:?}@redis:6379/7
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: 'false'
      WEBHOOK_GLOBAL_ENABLED: 'false'
      DEL_INSTANCE: 'false'
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution-instances:/evolution/instances
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      replicas: 1
      restart_policy: *restart
      placement:
        # No manager, como o Postgres: o volume das sessões é local ao nó, e uma
        # instância pareada que acorda noutra máquina acorda sem sessão.
        constraints: [node.role == manager]
      update_config: { order: stop-first }
      resources:
        limits: { memory: 1G }

  # ─── Migração ───────────────────────────────────────────────────────────────
  # Tarefa de uma passada só. `condition: on-failure` e não `any`: ao terminar
  # com 0 a task fica `Complete` e o Swarm NÃO a reinicia — é assim que se faz um
  # job aqui. `docker service ls` vai mostrar `0/1`, e isso é o esperado.
  #
  # Ela roda de novo a cada `stack deploy` que traga uma imagem nova, e os três
  # passos são idempotentes de propósito. Para forçar sem trocar de versão:
  #   docker service update --force petshop_migrator
  migrator:
    image: ${MIGRATOR_IMAGE:?defina MIGRATOR_IMAGE no .env.production (a imagem publicada do migrator)}
    networks: [interna]
    environment:
      NODE_ENV: production
      # Como owner: só ele cria papéis, políticas de RLS e triggers.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/petshop?schema=public
      # `directUrl` do schema.prisma. A CLI do Prisma PARSEIA o schema e aborta se a
      # variável não existir (P1012), mesmo que a URL não fosse usada — foi o que
      # derrubou o primeiro deploy real. O cliente em runtime não precisa dela, por
      # isso ela não aparece no backend: só a CLI (migrate/generate) a exige.
      # Mesmo valor da DATABASE_URL acima: migração roda como owner, e é o owner que
      # cria role, política de RLS e trigger.
      DATABASE_MIGRATION_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/petshop?schema=public
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?}
      APP_MAINTENANCE_PASSWORD: ${APP_MAINTENANCE_PASSWORD:?}
      ENCRYPTION_KEK: ${ENCRYPTION_KEK:?}
      EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER:?}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 15s
        # Um deploy novo espera o Postgres subir; o próprio CMD tem um
        # `pg_isready` na frente, então chegar a 5 falhas é migração quebrada,
        # não corrida de partida.
        max_attempts: 5
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 768M }

  # ─── Serviços ───────────────────────────────────────────────────────────────
  # O `command` começa pelo gate: sem ele, num banco novo, o backend sobe antes de
  # a role `app_user` existir e responde 500 parecendo saudável.
  api-gateway:
    <<: *backend
    command:
      ['/app/infra/swarm/aguardar-migracao.sh', 'node', 'backend/app/dist/src/server.js']
    environment:
      <<: *backend-env
      GATEWAY_PORT: 3000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?}
      # MOD-IDENT-03: assinatura do webhook de sincronização. Opcional — sem ela a rota
      # recusa tudo com 401, que é o comportamento certo de um endpoint sem segredo.
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      # Lista de origens exatas, e nunca um curinga: o `@clerk/backend` decide com
      # `authorizedParties.includes(azp)` — comparação de string, sem glob. Um
      # `https://*.${APP_DOMAIN}` não casa com nada e o host que de fato emite token,
      # `app.${APP_DOMAIN}`, ficava de fora: todo request do Admin viraria 401, e só
      # depois do deploy. O ápice segue na lista porque também serve o Admin
      # (`resolveHost` classifica o domínio nu como `admin`).
      #
      # O MOD-PORTAL chegou e o token passou a ser emitido também em
      # `{slug}.${APP_DOMAIN}` — um host por tenant, criado a qualquer hora, que esta
      # lista não tem como enumerar. A saída **não** foi crescer isto aqui: para as
      # rotas `/portal/v1`, o gateway deriva o host exato do slug que veio na
      # requisição e o acrescenta à lista daquela verificação (`portalAuthorizedParty`
      # em `app.ts`). É mais estreito que um curinga, não mais largo.
      CLERK_AUTHORIZED_PARTIES: https://app.${APP_DOMAIN:?},https://${APP_DOMAIN}
      # MOD-SITE: a galeria do site do estabelecimento, no mesmo bucket do álbum do
      # pet, em prefixo próprio. Vieram com o módulo na consolidação.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-petshop-media}
      R2_REGION: ${R2_REGION:-auto}
      # O canal WhatsApp (MOD-CRM-01) e o retorno do Resend (MOD-NOTIF-10), que vieram
      # com o módulo de mensagens na consolidação.
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      # Para onde a Evolution devolve o pareamento e as quedas de conexão: o próprio
      # backend, pela rede interna. Este webhook nunca passa pelo Caddy — o do Resend,
      # sim, porque quem o chama está na internet.
      EVOLUTION_WEBHOOK_URL: http://api-gateway:3000/internal/v1/whatsapp/webhook
      # Sem o segredo a rota do Resend recusa **tudo** com 401 — é deliberado: um
      # webhook aberto é uma porta para suprimir o endereço de qualquer concorrente.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # MOD-TUTOR: a consulta de CEP e a régua de inatividade, que vieram com o módulo.
      VIACEP_BASE_URL: ${VIACEP_BASE_URL:-https://viacep.com.br/ws}
      CEP_LOOKUP_TIMEOUT_MS: ${CEP_LOOKUP_TIMEOUT_MS:-3000}
      INACTIVITY_THRESHOLD_DAYS: ${INACTIVITY_THRESHOLD_DAYS:-90}
      # MOD-IDENT: o link do convite e o prazo dele, que vieram com o módulo na
      # fatia 7. `APP_URL` é a URL pública completa e **não** o `APP_DOMAIN`: o
      # convite vai num e-mail que uma pessoa clica, fora desta rede.
      # `app.` e não o ápice: com o roteamento por host (MOD-SITE-11) o Admin tem
      # endereço próprio, e `/convite` é rota de Admin. O ápice também serve o
      # Admin hoje, mas o link do convite dura dias — vale apontar para o
      # endereço canônico, não para o que funciona por enquanto.
      APP_URL: https://app.${APP_DOMAIN:?}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
    healthcheck: &hc-gateway
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 3
      # Cobre a espera pela migração. Um `start_period` curto faria o Swarm
      # declarar a task morta antes de o gate liberar, e num deploy novo isso
      # vira laço: mata, sobe, espera, mata.
      start_period: 180s

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:?defina FRONTEND_IMAGE no .env.production (a imagem publicada do frontend)}
    networks: [interna]
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3002
      # Nome de serviço, não domínio: o cliente HTTP é `server-only`, o browser
      # nunca fala com o gateway, e a chamada não sai da rede overlay.
      API_URL: http://api-gateway:3000
      # É daqui que o middleware tira qual host é de tenant e qual é da
      # plataforma. Em tempo de execução, e não `NEXT_PUBLIC_`: o prefixo público
      # seria inlinado no build e amarraria a imagem a uma instalação. Sem esta
      # variável o padrão é `localhost:3002` e TODO host cai no Admin — nada fica
      # exposto, mas o site do petshop e o Portal do Tutor não respondem.
      APP_DOMAIN: ${APP_DOMAIN:?}
      # A outra ponta do segredo de revalidação (AC-03 de MOD-SITE-11). **As duas
      # pontas ou nenhuma**: o backend já recebia a variável, o frontend não, e
      # `/api/site/revalidate` respondia 401 a toda invalidação. Nada falha alto —
      # `revalidateSite` só registra um `warn` — e o sintoma é o site do petshop
      # servindo horário velho por até dez minutos depois de corrigido, que é
      # exatamente a promessa que o módulo existe para cumprir.
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:?}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?}
      # Assada no bundle do browser em tempo de BUILD. O valor aqui só serve ao
      # lado servidor; trocá-la de verdade exige republicar a imagem do frontend.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    healthcheck:
      # O Next responde 307 para o login em `/`; `-o /dev/null` sem `-f` aceita
      # qualquer resposta HTTP. O que se quer saber é se o processo atende.
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:3002/ || exit 1']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy: *restart
      update_config: *update
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 768M }

  # ─── Borda ──────────────────────────────────────────────────────────────────
  caddy:
    image: ${CADDY_IMAGE:?defina CADDY_IMAGE no .env.production (a imagem publicada da borda)}
    networks: [interna]
    ports:
      # `mode: host` e não a malha de roteamento (`ingress`), que é o padrão.
      # A malha faz SNAT: todo request chegaria ao Caddy com o IP do nó, e o log
      # de acesso, o rate limit e qualquer investigação de abuso passariam a
      # enxergar um cliente só. Com um nó, a malha também não traz benefício.
      - { target: 80, published: 80, protocol: tcp, mode: host }
      - { target: 443, published: 443, protocol: tcp, mode: host }
      # Sem 443/UDP: o Caddyfile desliga o HTTP/3 (`protocols h1 h2`), porque na
      # VPS com EasyPanel o Caddy fica atrás de um proxy de camada 4, que não
      # encaminha UDP — e anunciar Alt-Svc para uma porta que não leva a lugar
      # nenhum custa uma tentativa perdida por visitante. O Caddyfile é um só
      # para as duas bordas; o que se perde aqui é o QUIC.
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      # Zone:DNS:Edit na zona de APP_DOMAIN. É o que assina o desafio DNS-01 —
      # sem DNS-01 não há certificado wildcard, e sem wildcard nenhum subdomínio
      # de tenant abre.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
      # A landing de venda, servida pela própria borda a partir de `/srv/landing`
      # (a imagem a carrega). Host próprio porque não é subdomínio de APP_DOMAIN:
      # o wildcard não o cobre e o Caddy emite um certificado só para ele.
      LANDING_DOMAIN: ${LANDING_DOMAIN:-lp.officestecnologia.com.br}
    volumes:
      # Os certificados vivem aqui. Perder este volume é pedir tudo de novo à
      # Let's Encrypt, que limita emissões por domínio por semana — e com
      # wildcard sobra pouca margem para tentativa e erro.
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      replicas: 1
      restart_policy: *restart
      placement:
        constraints: [node.role == manager]
      update_config:
        # `stop-first`: com `mode: host` as portas 80/443 do nó são exclusivas —
        # um segundo Caddy subindo antes de o primeiro sair ficaria preso em
        # "port is already allocated" e o `start-first` nunca convergiria.
        order: stop-first
      resources:
        limits: { memory: 256M }

networks:
  interna:
    driver: overlay
    # `attachable` para que um `docker run --network petshop_interna` de
    # manutenção (psql, um dump, uma inspeção) alcance o banco sem publicar
    # porta nenhuma.
    attachable: true

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  evolution-instances:
  caddy-data:
  caddy-config:
