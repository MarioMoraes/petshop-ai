# A landing page de venda (`frontend/landing-page`), servida estática.
#
# Só arquivos: nada aqui fala com o backend nem lê sessão, então o cabeçalho de
# segurança é o mínimo que vale para uma página pública. O TLS termina no Traefik
# do EasyPanel — este nginx só ouve HTTP dentro da rede `easypanel`.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # O healthcheck do container, sem gerar linha de log a cada 30s.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # HTML sempre revalidado: uma troca de preço precisa aparecer no próximo acesso.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # CSS e JS não têm hash no nome, então o cache é curto: uma hora e revalida.
  location ~* \.(css|js|svg)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
