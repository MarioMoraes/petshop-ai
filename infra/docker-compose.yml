name: petshop-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: petshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: petshop
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d petshop']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: petshop-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: petshop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: petshop
      RABBITMQ_DEFAULT_PASS: petshop
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  gotenberg:
    # Geração de PDF (SPEC §5). O Chromium fica aqui dentro, e não numa dependência
    # npm do serviço: um navegador headless em cada imagem de backend seria centenas
    # de MB replicados para imprimir um recibo.
    image: gotenberg/gotenberg:8
    container_name: petshop-gotenberg
    restart: unless-stopped
    # Ele escuta 3000 lá dentro, que no host é a porta do gateway. Daí o 3030.
    ports:
      - '3030:3000'
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  evolution:
    # O canal WhatsApp (MOD-CRM-01). Camada não-oficial sobre o WhatsApp Web: o petshop
    # pareia o **próprio** número por QR code, sem aprovação de template pela Meta e sem
    # custo por mensagem. A contrapartida é o risco de banimento, e é ela que justifica
    # a janela de silêncio, o teto diário, o aquecimento e o jitter que já vivem no
    # módulo de mensagens do backend.
    #
    # Tag fixa, nunca `latest`: uma sessão pareada é estado, e trocar de versão sozinho
    # é acordar com todos os petshops desconectados.
    # `evoapicloud`, e não `atendai`: o projeto trocou de organização no Docker Hub em
    # 2025, e o repositório antigo parou na v2.2.3 e deixou de aceitar pull anônimo —
    # um `docker pull` de lá responde "pull access denied", que parece erro de rede.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: petshop-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-api-key}
      # Database próprio na mesma instância — ver `postgres/init/02-create-evolution-db.sql`.
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: petshop
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      # O histórico de mensagens é do **produto** (tabela `messages`, cifrada com a DEK
      # do tenant). Deixar a Evolution guardar uma segunda cópia em claro seria criar um
      # depósito de dado pessoal fora de todo o controle que o MOD-CRM construiu.
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      CACHE_REDIS_ENABLED: 'true'
      # `/7` — os bancos de 0 a 6 são do produto; a Evolution não divide keyspace com
      # o cache de tenant.
      CACHE_REDIS_URI: redis://redis:6379/7
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: 'false'
      # O webhook é configurado **por instância**, no pareamento, com o token daquele
      # tenant. Um webhook global mandaria todo evento para um endereço só, e o
      # messaging-service não teria como saber de quem é a sessão.
      WEBHOOK_GLOBAL_ENABLED: 'false'
      # Apagar a instância ao desconectar apagaria a sessão pareada junto: uma queda de
      # rede do celular custaria um QR code novo.
      DEL_INSTANCE: 'false'
      LOG_LEVEL: ERROR,WARN
    ports:
      # Publicada **só em desenvolvimento**: aqui o `pnpm dev` roda no host e precisa
      # alcançá-la. Em produção ela fica na rede interna, sem rota no Caddy.
      - '8080:8080'
    volumes:
      - evolution-instances:/evolution/instances
    healthcheck:
      # A imagem não traz `curl`; o Node dela, sim.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  evolution-instances:
