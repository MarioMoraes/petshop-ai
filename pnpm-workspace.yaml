packages:
  - 'backend/*'
  - 'packages/*'
  - 'frontend'

allowBuilds:
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@prisma/client': true
  '@prisma/engines': true
  '@clerk/shared': true
  # Nenhum dos dois precisa rodar script de instalação para ser consumido do pacote
  # publicado: o do `@google/genai` é `prepare`, que só roda em instalação a partir do
  # git, e o do `protobufjs` é um aviso de pós-instalação. Ambos entraram com o provedor
  # Gemini do MOD-AI, hoje o único provedor do agente.
  '@google/genai': false
  protobufjs: false
