packages:
  - 'backend/*'
  - 'packages/*'
  - 'frontend'

allowBuilds:
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@prisma/client': true
  '@prisma/engines': true
  '@clerk/shared': true
  # Nenhum dos dois precisa rodar script de instalação para ser consumido do pacote
  # publicado: o do `@google/genai` é `prepare`, que só roda em instalação a partir do
  # git, e o do `protobufjs` é um aviso de pós-instalação. Ambos entraram com o provedor
  # Gemini do MOD-AI, hoje o único provedor do agente.
  '@google/genai': false
  protobufjs: false

# Correções de segurança em dependências que só entram como transitivas, sempre dentro
# da mesma major: `fast-uri` vem do `ajv` do Fastify, nas linhas 3 e 4, e o `postcss`
# 8.4.31 é cravado pelo Next. O `sharp` do Next é opcional e o próprio Next aceita a
# 0.35.4 em diante; sem o override o lockfile ficava na 0.34. O `deepmerge-ts` fica de fora: a correção é a major 8, e
# ele só entra pelo CLI do Prisma, sem rota alcançável pelo produto.
overrides:
  'fast-uri@>=3.0.0 <3.1.8': '^3.1.8'
  'fast-uri@>=4.0.0 <4.1.5': '^4.1.5'
  'postcss@<8.5.23': '^8.5.23'
  'sharp@<0.35.4': '^0.35.5'
