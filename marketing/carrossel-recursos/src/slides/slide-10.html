<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Estoque</title>
<link rel="stylesheet" href="../kit/petshop.css">
<script src="../kit/kit.js"></script>
<script src="../kit/anim.js"></script>
<script src="../kit/icones.js"></script>
<script src="../kit/ps.js"></script>
<style>
  .it { display: grid; grid-template-columns: 1fr 300px 130px; gap: 24px; align-items: center; padding: 30px 0; border-top: 2px solid var(--line); }
  .it .val { font-size: 28px; } .it .q { font-size: 26px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .it .bar-bg { position: relative; height: 18px; overflow: visible; } .it .bar-bg::after { content:''; position:absolute; left:25%; top:-6px; bottom:-6px; width:3px; border-radius:2px; background: var(--ink-strong); opacity:.35; }
</style></head><body><div id="quadro"></div><script>
const i = PS.i;
const it = (nome, pct, q, t, tone) => `<div class="it b" data-t="${t}"><span class="val">${nome}</span><span class="bar-bg ${tone}"><i class="b" data-k="larg" data-t="${t + 0.25}" style="width:${pct}%"></i></span><span class="q" style="${tone === 'tone-danger' ? 'color:var(--t-danger)' : ''}">${q}</span></div>`;
PS.recurso({ index: 10, fundo: 'claro', tone: 'tone-brand', icon: 'box', n: '08', nome: 'Estoque',
  t1: 'Estoque', t2: 'que avisa antes.',
  corpo: 'Cada venda e cada banho baixam o saldo.<br>Chegou no mínimo, o sino toca.',
  prova: `<div class="card" style="left:0;top:0;width:936px;height:560px;padding:28px 40px">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><span style="font-size:32px;font-weight:600;letter-spacing:-0.02em">Produtos e Insumos</span><span class="lbl">traço = mínimo</span></div>
      ${it('Shampoo Neutro 5 L', 12, '2 un.', 1.0, 'tone-danger')}
      ${it('Ração Premium 15 kg', 58, '8 un.', 1.5, 'tone-brand')}
      ${it('Vacina V10', 66, '14 doses', 2.0, 'tone-health')}
      ${it('Laço de Gravata', 86, '40 un.', 2.5, 'tone-pet')}
    </div>
    <div class="float b" data-t="3.5" data-k="pop" style="left:400px;top:470px">${PS.chip('tone-danger','bell',60,'claro')}<span><small>Repor agora</small><b>Shampoo Neutro · 2 un.</b></span></div>`,
  fecho: 'O shampoo não acaba no meio do banho.' });
</script></body></html>
