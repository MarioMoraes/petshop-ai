<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Caixa do Dia</title>
<link rel="stylesheet" href="../kit/petshop.css">
<script src="../kit/kit.js"></script>
<script src="../kit/anim.js"></script>
<script src="../kit/icones.js"></script>
<script src="../kit/ps.js"></script>
<style>
  .mv { display: flex; align-items: center; gap: 18px; padding: 11px 0; border-top: 2px solid var(--line); }
  .mv .val { flex: 1; font-size: 28px; } .mv .q { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mv .chip { width: 50px; height: 50px; font-size: 26px; border-radius: 15px; }
  .selo { position: absolute; padding: 18px 30px; border-radius: 22px; border: 5px solid var(--t-money); color: var(--t-money); background: #fff;
    font-size: 34px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; transform: rotate(-6deg); }
  .selo-w { position: absolute; }
</style></head><body><div id="quadro"></div><script>
const i = PS.i;
const mv = (tone, ic, nome, q, t, neg) => `<div class="mv b" data-t="${t}"><span class="${tone}"><span class="chip chip-light">${i(ic)}</span></span><span class="val">${nome}</span><span class="q" style="color:${neg ? 'var(--t-danger)' : 'var(--ink-strong)'}">${q}</span></div>`;
PS.recurso({ index: 8, fundo: 'claro', tone: 'tone-money', icon: 'cash', n: '06', nome: 'Caixa do Dia',
  t1: 'Caixa do Dia', t2: 'conferido em segundos.',
  corpo: 'Pix, cartão, dinheiro e sangria entram sozinhos.<br>O esperado se soma. Você só confere.',
  prova: `<div class="card" style="left:0;top:0;width:936px;height:560px;padding:28px 40px">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><span style="font-size:32px;font-weight:600;letter-spacing:-0.02em">Caixa · Sábado, 18</span></div>
      ${mv('tone-time','lock','Abertura','R$ 200,00',1.0)}
      ${mv('tone-metric','qr','Pix','+R$ 742,00',1.25)}
      ${mv('tone-people','phone','Cartão','+R$ 615,50',1.5)}
      ${mv('tone-money','cash','Dinheiro','+R$ 390,00',1.75)}
      ${mv('tone-danger','arrow','Sangria','−R$ 100,00',2.0,1)}
      <div class="row" style="justify-content:space-between;border-top:3px solid var(--ink-strong);padding-top:16px;margin-top:4px">
        <span style="font-size:30px;font-weight:600">Esperado</span><span class="num b" data-t="2.5" data-k="conta" data-to="1847.5" data-fmt="brl" style="font-size:44px;font-weight:700;color:var(--t-money)">R$ 1.847,50</span></div>
    </div>
    <div class="selo-w b" data-t="3.5" data-k="pop" style="left:540px;top:-30px"><div class="selo" style="position:static">Fechado · Sem Diferença</div></div>`,
  fecho: 'Fechar o caixa não é mais a última hora do dia.' });
</script></body></html>
