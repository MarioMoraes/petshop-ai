<html lang="pt-BR"><head><meta charset="utf-8">

<style>
  .vac { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-top: 2px solid var(--line); }

</style></head><body><div id="quadro"></div><script>

      <div class="lbl" style="margin:26px 0 8px;color:var(--t-health);font-weight:600">Carteira de Vacinação</div>
      <div class="vac b" data-t="1.5"><span class="val">V10</span><span class="doses"><i></i><i></i><i></i></span></div>
      <div class="vac b" data-t="2.0"><span class="val">Antirrábica</span><span class="doses"><i></i></span></div>
      <div class="vac b" data-t="2.5"><span class="val">Giárdia</span><span class="doses"><i></i><i class="v"></i></span></div>
    </div>
    <div class="card" style="left:600px;top:0;width:336px;height:560px;padding:30px 30px">
      <div class="lbl" style="font-weight:600;color:var(--t-pet)">Histórico</div>

    </div>
    <div class="float b" data-t="3.5" data-k="pop" style="left:200px;top:490px">${PS.chip('tone-health','bell',60,'claro')}<span><small>Giárdia · próxima dose em 12 dias</small><b>Tutor avisado</b></span></div>`,
