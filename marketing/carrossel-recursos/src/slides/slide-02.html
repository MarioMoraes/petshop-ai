<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Cinco Lugares</title>
<link rel="stylesheet" href="../kit/petshop.css">
<script src="../kit/kit.js"></script>
<script src="../kit/anim.js"></script>
<script src="../kit/icones.js"></script>
<script src="../kit/ps.js"></script>
</head><body><div id="quadro"></div><script>
const L = ['Caderno', 'Planilha', 'WhatsApp do celular', 'Maquininha', 'Grupo da equipe'];
const riscos = L.map((n, k) => `<span class="risco b" data-t="${1 + k * 0.25}" data-k="pop">${n}<i class="b" data-k="larg" data-t="${2.5 + k * 0.1}"></i></span>`).join('');
const mapa = PS.OITO.map((c, k) => `<div class="it b" data-t="${3.25 + k * 0.125}" data-k="pop">${PS.chip(c.tone, c.icon, 66, 'claro')}<span><span class="n">0${k + 1}</span><br>${c.nome}</span></div>`).join('');
PS.recurso({ index: 2, fundo: 'claro', tone: 'tone-brand', travessia: false,
  t1: 'Quase todo petshop', t2: 'roda em cinco lugares.', h1: { fontSize: '92px', top: '110px' },
  prova: `<div style="display:flex;flex-wrap:wrap;gap:14px">${riscos}</div>
    <div style="margin:40px 0 28px;font-size:34px;font-weight:600;letter-spacing:-0.02em">Cada lugar a mais é um recado perdido.</div>
    <div class="mapa">${mapa}</div>`,
  provaCss: { top: '380px', height: '760px' },
  fecho: 'Arrasta. É o dia inteiro, na ordem.', fechoT: 4.75 });
</script></body></html>
