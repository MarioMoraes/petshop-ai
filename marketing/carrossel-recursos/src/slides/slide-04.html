<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Atendimento com IA</title>
<link rel="stylesheet" href="../kit/petshop.css">
<script src="../kit/kit.js"></script>
<script src="../kit/anim.js"></script>
<script src="../kit/icones.js"></script>
<script src="../kit/ps.js"></script>
<style>
  .wa-h { height: 96px; background: var(--wa-dark); color: #fff; display: flex; align-items: center; gap: 14px; padding: 30px 24px 0; font-size: 24px; font-weight: 600; }
  .wa-h .av { width: 46px; height: 46px; border-radius: 50%; background: #fff3; display: grid; place-items: center; font-size: 24px; }
  .wa-b { position: absolute; inset: 96px 0 0; background: var(--wa-bg); padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
  .bal { max-width: 82%; padding: 12px 16px; border-radius: 18px; font-size: 23px; line-height: 1.28; font-weight: 500; color: #111; box-shadow: 0 1px 1px rgb(0 0 0 / .08); }
  .bal.in { background: #fff; align-self: flex-start; border-top-left-radius: 4px; }
  .bal.out { background: var(--wa-out-bubble, #d9fdd3); align-self: flex-end; border-top-right-radius: 4px; }
  .hor { display: flex; gap: 8px; margin-top: 8px; } .hor span { padding: 5px 10px; border-radius: 10px; background: #fff; color: var(--t-system); font-weight: 600; font-size: 19px; box-shadow: 0 0 0 1.5px var(--t-system-ring) inset; }
</style></head><body><div id="quadro"></div><script>
const i = PS.i;
PS.recurso({ index: 4, fundo: 'claro', tone: 'tone-system', icon: 'spark', n: '02', nome: 'Atendimento com IA',
  t1: 'Atende Sozinho', t2: '24 horas.',
  corpo: 'O agente responde no WhatsApp do petshop.<br>Oferece horário, confirma e grava na agenda.',
  prova: `<div class="phone" style="left:0;top:-8px;width:420px;height:590px"><div class="screen">
      <div class="wa-h"><span class="av">${i('paw')}</span>Patinhas Pet Center</div>
      <div class="wa-b">
        <div class="bal in b" data-t="1.0">Tem horário sábado pro Thor?</div>
        <div class="bal out b" data-t="1.5">Tenho sim! Qual fica melhor?<div class="hor"><span>09:00</span><span>10:30</span><span>14:00</span></div></div>
        <div class="bal in b" data-t="2.0">10:30</div>
        <div class="bal out b" data-t="2.5">Banho do Thor, sábado às 10:30. Confirma?</div>
        <div class="bal in b" data-t="3.0">Sim</div>
      </div></div></div>
    <div class="float b" data-t="3.5" data-k="pop" style="left:470px;top:150px">${PS.chip('tone-money','check',60,'claro')}<span><small>Agendado</small><b>Sáb · 10:30 · Banho</b></span></div>
    <div class="float b" data-t="4.0" data-k="pop" style="left:470px;top:290px">${PS.chip('tone-system','mic',60,'claro')}<span><small>Mandou áudio?</small><b>Entende também</b></span></div>
    <div class="float b" data-t="1.0" data-k="pop" style="left:470px;top:10px">${PS.chip('tone-time','cal',60,'claro')}<span><small>Grava direto</small><b>Na agenda do dia</b></span></div>`,
  fecho: 'Domingo à noite, ninguém fica sem resposta.' });
</script></body></html>
